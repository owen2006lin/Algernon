[project]
name = "algernon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "owen2006lin", email = "owen2006lin@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "dotenv>=0.9.9",
    "huggingface-hub>=2.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "transformers>=5.22.1",
]

[project.scripts]
algernon = "algernon:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
